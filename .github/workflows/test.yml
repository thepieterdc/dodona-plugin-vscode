name: Test

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install xvfb
        run: sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # mysql 8.4 disables mysql_native_password by default, which is the only
      # auth plugin the dodona image's mysql client supports. A service
      # container cannot take a command, so the containers are started here.
      - name: Start the database
        run: |
          docker network create dodona
          mkdir init
          cat > init/00_init.sql <<'SQL'
          CREATE USER IF NOT EXISTS 'dodona'@'%' IDENTIFIED BY 'dodona';
          GRANT ALL ON dodona.* TO 'dodona'@'%';
          GRANT ALL ON dodona_cache.* TO 'dodona'@'%';
          GRANT ALL ON dodona_queue.* TO 'dodona'@'%';
          GRANT ALL ON dodona_test.* TO 'dodona'@'%';
          GRANT ALL ON `dodona_test_%`.* TO 'dodona'@'%';
          SQL
          docker run -d --name database --network dodona \
            -e MYSQL_DATABASE=dodona -e MYSQL_ROOT_PASSWORD=dodona \
            -v "$PWD/init:/docker-entrypoint-initdb.d" \
            --health-cmd "mysqladmin ping --silent" --health-interval 10s --health-timeout 10s --health-retries 6 \
            mysql:8 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --mysql-native-password=ON --authentication-policy=mysql_native_password --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
          timeout 120 bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} database)" = healthy ]; do sleep 5; done'

      - name: Start dodona
        run: docker run -d --name dodona --network dodona -p 3000:3000 ghcr.io/dodona-edu/dodona:develop-latest

      - name: Wait for dodona to boot
        run: timeout 300 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:3000/activities.json)" != "200" ]]; do sleep 5; done' || { docker logs dodona; false; }

      - run: xvfb-run -a pnpm run test:integration

      - name: Upload the coverage report
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}

  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:unit

      - name: Upload the coverage report
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}