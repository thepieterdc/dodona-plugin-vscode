name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create a release branch
        run: |
          git checkout -b release
          git push -u origin release

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set the version in package.json
        run: node scripts/set-version.mts ${{ github.event.inputs.version }}

      - name: Create a release commit
        uses: EndBug/add-and-commit@v11
        with:
          add: "package.json"
          commit: "--signoff"
          message: Release v${{ github.event.inputs.version }}
          push: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package the extension
        run: pnpm package

      - name: Create tag
        uses: mathieudutour/github-tag-action@v7
        with:
          custom_tag: ${{ github.event.inputs.version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create "v$VERSION" "dodona-plugin-vscode-$VERSION.vsix" \
            --title "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}

      - name: Publish to Azure Marketplace
        run: pnpm run vscode:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Prepare package.json for next version
        run: node scripts/prepare-next-snapshot.mts

      - name: Push new development commit
        uses: EndBug/add-and-commit@v11
        with:
          add: "package.json"
          commit: "--signoff"
          message: "Prepare next development cycle"

      - name: Open a pull request
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "master"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: Release v${{ github.event.inputs.version }}
          source_branch: release